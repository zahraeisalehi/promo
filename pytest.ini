[pytest]
markers =
    heavy: reads a parquet artefact from data/interim; excluded from the fast
        pass with -m "not heavy". See "Test discipline" in CLAUDE.md.
    slow: fits hundreds of models and takes minutes — the Task 4.4 recovery
        grid. Excluded from the fast pass with -m "not slow"; run deliberately
        with -m slow when the estimator changes.
